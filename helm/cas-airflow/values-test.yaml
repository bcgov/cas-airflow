# Values override for test namespace
# override example: helm install -f values-test.yaml -f values.yaml airflow .

airflow:
  uid: 1002480000
  gid: 1002480000

  config:
    logging:
      remote_base_log_folder: gs://0fad32-test-airflow-logs
    smtp:
      smtp_mail_from: cas-airflow-test@gov.bc.ca

  env:
    - name: GOOGLE_APPLICATION_CREDENTIALS
      value: /gcs/credentials.json
    - name: AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_STORAGE_PATH
      value: "/opt/airflow/dag_bundles"
    # Allows for the dags to import the common configuration `dags/dag_configuration.py`
    - name: PYTHONPATH
      value: "/opt/airflow/dags:/opt/airflow/dag_bundles"
    - name: ENVIRONMENT
      value: test

  workers:
    kubernetes:
      extraVolumeMounts:
        - name: gcs-credentials
          mountPath: /gcs
          readOnly: true
        - name: cas-airflow-dynamic-dags
          mountPath: /opt/airflow/dags/dynamic
      extraVolumes:
        - name: gcs-credentials
          secret:
            secretName: gcp-0fad32-test-airflow-logs-service-account-key
        - name: cas-airflow-dynamic-dags
          persistentVolumeClaim:
            claimName: cas-airflow-dynamic-dags-pvc

  apiServer:
    extraVolumeMounts:
      - name: gcs-credentials
        mountPath: /gcs
        readOnly: true
    extraVolumes:
      - name: gcs-credentials
        secret:
          secretName: gcp-0fad32-test-airflow-logs-service-account-key
